<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FB Video Downloader PRO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>

<div class="app glass">
  <h1 class="neon">FB VIDEO DOWNLOADER</h1>

  <input id="url" placeholder="Dán link Facebook vào đây..." />

  <button id="fetch">
    <span class="btn-text">LẤY VIDEO</span>
    <span class="spinner"></span>
  </button>

  <div id="toast"></div>

  <div id="progressBox" class="hide">
    <div id="progress"></div>
  </div>

  <div id="result" class="hide scale-in">
    <img id="thumb">
    <h2 id="title"></h2>
    <p id="duration"></p>
    <div id="qualities"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
