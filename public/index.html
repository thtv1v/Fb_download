<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FB Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>Facebook Video Downloader</h1>

  <input id="url" placeholder="Dán link Facebook vào đây" />
  <button id="fetch">LẤY VIDEO</button>

  <div id="error"></div>

  <div id="progressBox" class="hide">
    <div id="progress"></div>
  </div>

  <div id="result" class="hide">
    <img id="thumb">
    <h3 id="title"></h3>
    <p id="duration"></p>
    <div id="qualities"></div>
  </div>
</div>

<!-- Overlay loading -->
<div id="overlay" class="hide">
  <div class="spinner"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
