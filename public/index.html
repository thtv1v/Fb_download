<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FB Video Downloader</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
  <div class="app">
    <h1>FB Downloader</h1>

    <input id="url" placeholder="Dán link Facebook..." />
    <button id="fetch">LẤY VIDEO</button>

    <div id="error"></div>

    <div id="result" class="hide">
      <img id="thumb" />
      <h2 id="title"></h2>
      <p id="duration"></p>
      <div id="qualities"></div>
    </div>

    <div id="progressBox" class="hide">
      <div id="progress"></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
